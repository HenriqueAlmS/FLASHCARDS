<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard - Digital Circus</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div id="tituloQuestao" class="titulo">
        Questão 1 de 12
    </div>

    <div class="flashcard" id="flashcard">

        <div class="face front">
            <h2 id="pergunta"></h2>
            <p>Clique para ver a resposta.</p>
        </div>

        <div class="face back">
            <h2>Resposta</h2>
            <p id="resposta"></p>
        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
